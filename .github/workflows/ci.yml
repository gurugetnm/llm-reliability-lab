name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: llm_lab
          POSTGRES_PASSWORD: llm_lab
          POSTGRES_DB: llm_reliability_lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llm_lab -d llm_reliability_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/llm -e packages/shared -e "apps/api[dev]"

      - name: Create test database and pgvector extension
        run: |
          PGPASSWORD=llm_lab psql -h localhost -U llm_lab -d llm_reliability_lab -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=llm_lab psql -h localhost -U llm_lab -d llm_reliability_lab -c "CREATE DATABASE llm_reliability_lab_test;"
          PGPASSWORD=llm_lab psql -h localhost -U llm_lab -d llm_reliability_lab_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Ruff
        run: |
          ruff check apps/api packages --config apps/api/pyproject.toml
          ruff format --check apps/api packages --config apps/api/pyproject.toml

      - name: mypy
        run: mypy apps/api/app packages/llm/src --config-file apps/api/pyproject.toml

      - name: Alembic migration check
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://llm_lab:llm_lab@localhost:5432/llm_reliability_lab
        run: alembic upgrade head

      - name: pytest
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://llm_lab:llm_lab@localhost:5432/llm_reliability_lab
        run: pytest -v

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      - run: corepack pnpm --filter web exec eslint .
      - run: corepack pnpm --filter web exec tsc --noEmit
      - run: corepack pnpm --filter web test
      - run: corepack pnpm --filter web build
