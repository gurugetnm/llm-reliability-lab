[project]
name = "llm-reliability-lab-llm"
version = "0.1.0"
description = "Provider-agnostic LLM abstraction for LLM Reliability Lab (generate, generate_structured, stream, get_model_info)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "mypy>=1.10", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliability_lab_llm"]
