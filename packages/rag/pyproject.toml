[project]
name = "llm-reliability-lab-rag"
version = "0.1.0"
description = "RAG configuration and retrieval evaluation for LLM Reliability Lab (Phase 5 — not yet implemented)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliability_lab_rag"]
