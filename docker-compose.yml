services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm_lab}
      POSTGRES_DB: ${POSTGRES_DB:-llm_reliability_lab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm_lab} -d ${POSTGRES_DB:-llm_reliability_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-llm_lab}:${POSTGRES_PASSWORD:-llm_lab}@db:5432/${POSTGRES_DB:-llm_reliability_lab}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # From inside the container, "localhost" is the container itself —
      # host.docker.internal reaches Ollama running on the host machine.
      # Deliberately a *different* env var than OLLAMA_BASE_URL (used for
      # native/non-Docker dev in .env.example): both are read from the
      # same root .env file, and if this used OLLAMA_BASE_URL too, its
      # native-dev value of "http://localhost:11434" would silently win
      # here and point the container at itself instead of the host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-llama3.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next

volumes:
  postgres-data:
